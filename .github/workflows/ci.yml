name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Deny by default. No job in this workflow writes anything; the publish path lives in
# release.yml, which grants id-token only to its publish jobs.
permissions:
  contents: read

jobs:
  editorconfig:
    name: .editorconfig copies are identical
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The canonical file is mirrored into the npm and Python packages so each can be installed
      # standalone. Nothing enforces that at runtime, so it is enforced here.
      - name: Compare mirrors against the canonical file
        run: |
          diff -u .editorconfig js/generated/.editorconfig
          diff -u .editorconfig src/matchory_coding_style/data/editorconfig

      # The npm tarball needs its own LICENSE: the canonical one sits at the repository root, and npm
      # only picks up a licence file from the package directory.
      - name: LICENSE mirror matches
        run: diff -u LICENSE js/LICENSE

      - name: Every manifest declares the same licence
        run: |
          status=0
          php_license="$(python3 -c "import json;print(json.load(open('composer.json'))['license'])")"
          npm_license="$(python3 -c "import json;print(json.load(open('js/package.json'))['license'])")"
          py_license="$(grep -m1 '^license = ' pyproject.toml | cut -d'"' -f2)"

          for pair in "composer.json:${php_license}" "js/package.json:${npm_license}" "pyproject.toml:${py_license}"; do
            if [ "${pair##*:}" != 'MIT' ]; then
              echo "::error::${pair%%:*} declares ${pair##*:}, expected MIT"
              status=1
            fi
          done

          exit "${status}"

  php:
    name: PHP presets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      # Every preset is only ever read by another tool, so a typo would otherwise surface in a
      # consumer rather than here.
      - name: Pint presets are derived from base.json
        run: php php/bin/generate-pint-presets.php --check

      - name: Pint presets are valid
        run: |
          for preset in php/pint/*.json; do
            echo "::group::${preset}"
            vendor/bin/pint --config "${preset}" --test php/src || true
            php -r 'json_decode(file_get_contents($argv[1]), true, 512, JSON_THROW_ON_ERROR);' "${preset}"
            echo "::endgroup::"
          done

      # Covers laravel.neon too, which cannot be included in a real run here: its parameters are
      # registered by Larastan and need a Laravel application to resolve.
      - name: PHPStan presets are valid neon
        run: |
          php -r '
            require "vendor/autoload.php";
            $failed = false;
            foreach (glob("php/phpstan/*.neon") as $preset) {
                try {
                    Nette\Neon\Neon::decodeFile($preset);
                    printf("ok    %s\n", $preset);
                } catch (Throwable $exception) {
                    printf("FAIL  %s: %s\n", $preset, $exception->getMessage());
                    $failed = true;
                }
            }
            exit($failed ? 1 : 0);
          '

      - name: PHPStan presets apply
        run: |
          # Analysing this package's own source proves the stub paths resolve, the ignore patterns
          # compile, and base.neon really does arrive via extension-installer.
          vendor/bin/phpstan analyse --no-progress \
            --configuration=.github/phpstan-ci.neon

      - name: Rector presets build
        run: vendor/bin/rector process --dry-run --no-progress-bar --config=.github/rector-build.php

      - name: Rector library preset runs
        run: vendor/bin/rector process --dry-run --no-progress-bar --config=.github/rector-ci.php

      # The pest() preset returns the config untouched when its provider is absent. That is correct
      # behaviour, but it means a wrong probe class, a renamed rule, or another provider swap would
      # silently disable every Pest rule while Rector still exits 0. Assert a rule actually fires.
      - name: Pest rules actually fire
        run: |
          work="$(mktemp -d)"
          mkdir -p "${work}/tests"
          printf '<?php\n\ndeclare(strict_types=1);\n\nit("probes", function (): void {\n    expect(true)->toBe(true);\n});\n' \
            > "${work}/tests/ProbeTest.php"
          printf '<?php\n\ndeclare(strict_types=1);\n\nrequire "%s/vendor/autoload.php";\n\nuse Matchory\\CodingStyle\\Rector\\Preset;\nuse Rector\\Config\\RectorConfig;\n\nreturn Preset::pest(RectorConfig::configure())->withPaths(["%s/tests"]);\n' \
            "${GITHUB_WORKSPACE}" "${work}" > "${work}/rector.php"

          output="$(vendor/bin/rector process --dry-run --no-progress-bar --config="${work}/rector.php" || true)"
          printf '%s\n' "${output}"

          if ! printf '%s\n' "${output}" | grep -q 'SimplifyToLiteralBooleanRector'; then
            echo "::error::the pest() preset registered no rules; check the provider probe class"
            exit 1
          fi

      # base.neon may only declare parameters that no other auto-discovered extension declares,
      # because PHPStan merges extension configs after includes and the last one wins. A parameter
      # added here that another extension also sets would be silently discarded. This asserts the
      # current set really does reach a consumer, using a throwaway project that installs the package
      # the same way a real one does.
      - name: Auto-discovered parameters reach a consumer
        run: |
          probe="$(mktemp -d)"
          cat > "${probe}/composer.json" <<JSON
          {
              "name": "matchory/ci-probe",
              "require-dev": { "matchory/coding-style": "*" },
              "repositories": [
                  { "type": "path", "url": "${GITHUB_WORKSPACE}", "options": { "symlink": false } }
              ],
              "config": { "allow-plugins": { "phpstan/extension-installer": true } },
              "minimum-stability": "dev"
          }
          JSON
          mkdir -p "${probe}/src"
          printf '<?php\n\ndeclare(strict_types=1);\n\nfinal class Probe {}\n' > "${probe}/src/Probe.php"
          printf 'parameters:\n    level: 5\n    paths:\n        - src\n' > "${probe}/phpstan.neon"

          cd "${probe}"
          composer install --no-interaction --no-progress
          composer show matchory/coding-style > /dev/null

          parameters="$(vendor/bin/phpstan dump-parameters)"
          status=0
          for expected in \
            'reportUnmatchedIgnoredErrors: false' \
            'treatPhpDocTypesAsCertain: false' \
            "editorUrl: 'phpstorm://open?file=%file%&line=%line%'"
          do
            if ! printf '%s\n' "${parameters}" | grep -qF "${expected}"; then
              echo "::error::base.neon did not reach the consumer: ${expected}"
              status=1
            fi
          done

          vendor/bin/matchory-coding-style sync
          diff -u "${GITHUB_WORKSPACE}/.editorconfig" .editorconfig
          vendor/bin/pint --config vendor/matchory/coding-style/php/pint/base.json --test src

          # `verify` has to discriminate, not just exit 0. This probe has no pint script, no
          # phpstan.neon and no rector.php, so it must fail; then wire it up and it must pass.
          if vendor/bin/matchory-coding-style verify > /dev/null 2>&1; then
            echo "::error::verify passed an unwired project"
            status=1
          fi

          printf 'includes:\n    - vendor/matchory/coding-style/php/phpstan/complexity.neon\n\nparameters:\n    level: 5\n    paths:\n        - src\n    cognitive_complexity:\n        class: 50\n        function: 15\n' \
            > phpstan.neon
          printf '<?php\n\ndeclare(strict_types=1);\n\nuse Matchory\\CodingStyle\\Rector\\Preset;\nuse Rector\\Config\\RectorConfig;\n\nreturn Preset::library(RectorConfig::configure())->withPaths([__DIR__ . "/src"]);\n' \
            > rector.php
          python3 - <<'PY'
          import json, pathlib
          path = pathlib.Path("composer.json")
          manifest = json.loads(path.read_text())
          manifest["scripts"] = {
              "fmt": "pint --config vendor/matchory/coding-style/php/pint/base.json --parallel"
          }
          path.write_text(json.dumps(manifest, indent=4) + "\n")
          PY

          vendor/bin/matchory-coding-style verify --strict
          exit "${status}"

  laravel:
    name: Laravel preset under real Larastan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: none

      # laravel.neon is the one preset that cannot be exercised from this repository: its parameters
      # are registered by Larastan, which needs a bootstrapped Laravel application. So build the
      # smallest real one. A 7-line bootstrap/app.php is enough for Larastan to resolve
      # Larastan\Larastan\LARAVEL_VERSION and analyse properly.
      #
      # This is a stopgap. Once the Laravel template repository exists it becomes the natural
      # consumer to point this at, instead of a skeleton maintained here.
      - name: Build a Laravel consumer
        run: |
          probe="$(mktemp -d)"
          echo "PROBE=${probe}" >> "${GITHUB_ENV}"
          mkdir -p "${probe}/app/Models" "${probe}/bootstrap/cache"

          cat > "${probe}/composer.json" <<JSON
          {
              "name": "matchory/laravel-probe",
              "require": { "laravel/framework": "^12.0" },
              "require-dev": {
                  "matchory/coding-style": "*",
                  "larastan/larastan": "^3.0"
              },
              "repositories": [
                  { "type": "path", "url": "${GITHUB_WORKSPACE}", "options": { "symlink": false } }
              ],
              "config": { "allow-plugins": { "phpstan/extension-installer": true } },
              "minimum-stability": "dev",
              "prefer-stable": true
          }
          JSON

          printf '<?php\n\ndeclare(strict_types=1);\n\nuse Illuminate\\Foundation\\Application;\n\nreturn Application::configure(basePath: dirname(__DIR__))->create();\n' \
            > "${probe}/bootstrap/app.php"

          # Uses Eloquent's event plumbing without extending Model, which is what the preset's one
          # ignore exists for. Index and search model variants look like this.
          printf '<?php\n\ndeclare(strict_types=1);\n\nnamespace App\\Models;\n\nuse Illuminate\\Database\\Eloquent\\Concerns\\HasEvents;\n\nfinal class IndexedProbe\n{\n    use HasEvents;\n}\n' \
            > "${probe}/app/Models/IndexedProbe.php"

          printf 'includes:\n    - vendor/matchory/coding-style/php/phpstan/laravel.neon\n    - vendor/matchory/coding-style/php/phpstan/complexity.neon\n\nparameters:\n    level: 5\n    paths:\n        - app\n    cognitive_complexity:\n        class: 50\n        function: 15\n' \
            > "${probe}/phpstan.neon"

          printf 'includes:\n    - vendor/matchory/coding-style/php/phpstan/complexity.neon\n\nparameters:\n    level: 5\n    paths:\n        - app\n    cognitive_complexity:\n        class: 50\n        function: 15\n' \
            > "${probe}/phpstan-without-laravel.neon"

          cd "${probe}" && composer install --no-interaction --no-progress

      - name: laravel.neon parameters reach the consumer
        working-directory: ${{ env.PROBE }}
        run: |
          parameters="$(vendor/bin/phpstan dump-parameters)"
          status=0

          for expected in 'disableMigrationScan: true' 'disableSchemaScan: true'; do
            if ! printf '%s\n' "${parameters}" | grep -qF "${expected}"; then
              echo "::error::laravel.neon did not apply: ${expected}"
              status=1
            fi
          done

          exit "${status}"

      # Asserting both directions. A preset whose ignores silently stopped matching would still
      # analyse clean, so "0 errors" alone proves nothing.
      - name: laravel.neon suppresses what it claims to
        working-directory: ${{ env.PROBE }}
        run: |
          vendor/bin/phpstan analyse --no-progress

          without="$(vendor/bin/phpstan analyse --no-progress --error-format=json \
            -c phpstan-without-laravel.neon || true)"

          if ! printf '%s\n' "${without}" | grep -q 'class.missingExtends'; then
            echo "::error::the HasEvents ignore is not discriminating; without laravel.neon the error should appear"
            exit 1
          fi

  javascript:
    name: JavaScript presets
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.33.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: js/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generated files are derived from src/
        run: node scripts/generate.mjs --check

      # buildFromOxlintConfig() reads the oxlint object at load time, so importing the ESLint presets
      # proves both halves compose. A broken preset otherwise only fails inside a consumer.
      - name: Presets import and compose
        run: |
          node --input-type=module -e '
            import { core, withCore } from "./src/eslint/base.js";
            import { vue, withVue } from "./src/eslint/vue.js";
            import { oxlintBase } from "./src/oxlint/base.js";
            import { oxlintVue } from "./src/oxlint/vue.js";
            import { oxfmtBase } from "./src/oxfmt/base.js";

            const assert = (condition, message) => {
              if (!condition) { throw new Error(message); }
            };

            assert(core.length > 0, "eslint core is empty");
            assert(withCore([{ files: ["x"] }]).length === core.length + 1, "withCore does not append");
            assert(vue().length > core.length, "vue overlay adds nothing");
            assert(withVue({}, [{ files: ["x"] }]).length === vue().length + 1, "withVue does not append");

            assert(!oxlintBase.plugins.includes("vue"), "vue plugin leaked into the oxlint base");
            assert(oxlintVue.plugins.includes("vue"), "vue plugin missing from the vue preset");
            assert(
              Object.keys(oxlintBase.rules).every((rule) => !rule.startsWith("vue/")),
              "vue rules leaked into the oxlint base",
            );

            assert(oxfmtBase.tabWidth === 4, "canonical indentation changed");
            assert(oxfmtBase.singleQuote === true, "canonical quote style changed");
            assert(oxfmtBase.sortTailwindcss === undefined, "oxfmt must not own tailwind ordering");

            console.log("presets compose");
          '

      # A probe needs real inputs: tsc fails with TS18003 on an empty program even for --showConfig,
      # which would mask a genuinely broken `extends` chain.
      - name: tsconfig presets resolve
        run: |
          for preset in src/tsconfig/*.json; do
            echo "::group::${preset}"
            echo '{"extends":"./'"${preset}"'","include":["src/**/*.d.ts"]}' > "tsconfig.probe.json"
            pnpm exec tsc --showConfig --project tsconfig.probe.json > /dev/null
            rm tsconfig.probe.json
            echo "::endgroup::"
          done

      - name: This package satisfies its own presets
        run: |
          pnpm exec oxfmt --check src bin scripts ./*.ts
          pnpm exec oxlint src bin scripts
          pnpm exec tsc --noEmit

      # Both directions: an unwired project must fail, a wired one must pass. `verify` exists to
      # catch a repository that depends on the package but still lints with its own rules, so a
      # version that always passed would be worse than useless.
      - name: verify discriminates
        run: |
          probe="$(mktemp -d)"
          cd "${probe}"
          status=0

          if node "${GITHUB_WORKSPACE}/js/bin/cli.mjs" verify > /dev/null 2>&1; then
            echo "::error::verify passed an unwired project"
            status=1
          fi

          cp "${GITHUB_WORKSPACE}/.editorconfig" .
          printf "import { oxfmtBase } from '@matchory/coding-style/oxfmt';\nexport default { ...oxfmtBase };\n" > oxfmt.config.ts
          printf "import { oxlintVue } from '@matchory/coding-style/oxlint/vue';\nexport default { ...oxlintVue };\n" > oxlint.config.ts
          printf "import { withVue } from '@matchory/coding-style/eslint/vue';\nexport default withVue();\n" > eslint.config.js
          printf '{ "extends": "@matchory/coding-style/tsconfig/vue.json" }\n' > tsconfig.json

          node "${GITHUB_WORKSPACE}/js/bin/cli.mjs" verify --strict

          # A config that exists but ignores the preset is the subtle case: the file is there, so a
          # presence check would pass it.
          printf 'export default { rules: {} };\n' > oxlint.config.ts

          if node "${GITHUB_WORKSPACE}/js/bin/cli.mjs" verify > /dev/null 2>&1; then
            echo "::error::verify passed a config that does not import the preset"
            status=1
          fi

          exit "${status}"

  python:
    name: Python presets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      # A virtualenv rather than --system: the runner's interpreter is externally managed (PEP 668),
      # so a system install is refused outright.
      - name: Build and install the package
        run: |
          uv venv
          uv pip install .
          echo "${PWD}/.venv/bin" >> "${GITHUB_PATH}"

      # The presets chain by relative path (pyproject -> .matchory/ruff.toml -> ruff/strict.toml ->
      # ruff/base.toml), which only holds if `sync` copies all of them. Asserting on which rules fire
      # proves both that the chain resolved and that the two tiers are genuinely different — a
      # silently empty config would exit 0 and look like success.
      - name: sync writes a config real ruff accepts
        run: |
          status=0

          for preset in base strict; do
            echo "::group::${preset}"
            work="$(mktemp -d)"
            matchory-coding-style sync --preset "${preset}" --project-root "${work}"

            printf '[project]\nname = "probe"\nversion = "0.1.0"\n\n[tool.ruff]\nextend = ".matchory/ruff.toml"\n' \
              > "${work}/pyproject.toml"
            printf 'import os\n\n\ndef probe(value):\n    print(value)\n    return os.path.join("a", value)\n' \
              > "${work}/probe.py"

            findings="$(cd "${work}" && ruff check --no-cache --output-format concise . || true)"
            printf '%s\n' "${findings}"

            # PTH118 is selected by base, so it must fire for both presets.
            if ! printf '%s\n' "${findings}" | grep -q 'PTH118'; then
              echo "::error::${preset}: base rules did not apply, the extend chain is broken"
              status=1
            fi

            # T201 (print found) is selected only by strict.
            if printf '%s\n' "${findings}" | grep -q 'T201'; then
              if [ "${preset}" = 'base' ]; then
                echo "::error::base: strict-only rule T201 fired, the tiers have collapsed"
                status=1
              fi
            elif [ "${preset}" = 'strict' ]; then
              echo "::error::strict: T201 did not fire, strict.toml was not applied"
              status=1
            fi

            (cd "${work}" && ruff format --no-cache --check .) || true
            matchory-coding-style sync --preset "${preset}" --project-root "${work}" --check
            echo "::endgroup::"
          done

          exit "${status}"

      - name: verify discriminates
        run: |
          probe="$(mktemp -d)"
          cd "${probe}"
          status=0

          if matchory-coding-style verify > /dev/null 2>&1; then
            echo "::error::verify passed an unwired project"
            status=1
          fi

          matchory-coding-style sync --preset strict
          printf '[project]\nname = "probe"\nversion = "0.1.0"\n\n[tool.ruff]\nextend = ".matchory/ruff.toml"\n' \
            > pyproject.toml
          matchory-coding-style verify --strict

          # A [tool.ruff] section that inlines its own rules instead of extending the copy is the
          # case that matters: the section exists, so a presence check would pass it.
          printf '[project]\nname = "probe"\nversion = "0.1.0"\n\n[tool.ruff]\nline-length = 88\n' \
            > pyproject.toml

          if matchory-coding-style verify > /dev/null 2>&1; then
            echo "::error::verify passed a project with inlined ruff rules"
            status=1
          fi

          exit "${status}"

      # The release builds a checksum manifest and verifies it from inside dist/. A path-prefix mistake
      # there is invisible until a tag is already cut and immutable, so the round trip is exercised
      # here instead of being discovered during a release.
      - name: Checksum manifest round-trips the way the release verifies it
        run: |
          work="$(mktemp -d)"
          cp -r pyproject.toml src README.md LICENSE "${work}/"
          cd "${work}"

          uv build --out-dir dist
          ( cd dist && sha256sum -- *.whl *.tar.gz > SHA256SUMS )
          ( cd dist && sha256sum --check SHA256SUMS )

          # And it must still fail on tampering, or it is decoration.
          printf 'tampered' >> dist/*.whl

          if ( cd dist && sha256sum --check --status SHA256SUMS ); then
            echo '::error::the checksum manifest did not detect a modified artefact'
            exit 1
          fi

          echo 'Checksum manifest round-trips and detects tampering'

      - name: This repository satisfies its own strict preset
        run: ruff check --no-cache src/ && ruff format --no-cache --check src/
