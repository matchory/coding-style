name: Release

# Publishing is driven by signed tags, and every registry that supports it receives a cryptographic
# attestation tying the artefact to this workflow run and this commit.
#
# Design rules, all deliberate:
#
#   1. No long-lived credentials anywhere. npm and PyPI both authenticate via OIDC trusted
#      publishing, so there is no token in this repository to steal.
#   2. Build once, attest, then publish that exact artefact. A publish step cannot substitute
#      different content for what was attested.
#   3. `permissions: {}` at the top level. Every job opts in to the minimum it needs, and only the
#      publish jobs get `id-token: write`.
#   4. Every action is pinned to a full commit SHA. A moved tag cannot change what runs.
#   5. The publish jobs run in the `release` environment, which requires a human approval and is
#      restricted to `v*` tags. The OIDC token therefore carries an environment claim that a branch
#      build cannot forge, and the registries are configured to require it.
#   6. No third-party actions in the publish path. Only actions/* and pypa/*.
#
# Packagist is absent on purpose: it reads tags from this repository and builds nothing, so there is
# no artefact to attest. Composer has no provenance mechanism, which makes the signed tag and the
# repository's branch protection the whole of its supply-chain story. See SECURITY.md.

on:
  push:
    tags: ['v*']

permissions: {}

env:
  # Trusted publishing needs npm 11.5.1 or newer. setup-node bundles whatever shipped with the Node
  # release, so the version is pinned to an exact patch rather than left to a floating major. Renovate
  # keeps it current.
  NPM_VERSION: '12.0.2'

jobs:
  verify:
    name: Verify the tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      dist_tag: ${{ steps.version.outputs.dist_tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: version
        name: Resolve version and dist-tag from the tag
        run: |
          version="${GITHUB_REF_NAME#v}"

          if ! printf '%s' "${version}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::tag ${GITHUB_REF_NAME} is not a semver version"
            exit 1
          fi

          # A prerelease must NOT become the default install for every consumer, which is what
          # publishing it under the `latest` dist-tag would do. Derive the channel from the prerelease
          # identifier: 1.0.0-rc.1 -> rc, 1.0.0-beta.2 -> beta, anything unrecognised -> next.
          if printf '%s' "${version}" | grep -q -- '-'; then
            channel="$(printf '%s' "${version#*-}" | cut -d. -f1 | tr -cd '[:alpha:]')"
            [ -n "${channel}" ] || channel='next'
            prerelease=true
          else
            channel='latest'
            prerelease=false
          fi

          {
            echo "version=${version}"
            echo "dist_tag=${channel}"
            echo "prerelease=${prerelease}"
          } >> "$GITHUB_OUTPUT"

          echo "Releasing ${version} to dist-tag '${channel}' (prerelease: ${prerelease})"

      # An unsigned tag is an unauthenticated instruction to publish. GitHub's own verification
      # status is used rather than importing keys here, so the check reflects the same trust GitHub
      # shows in the UI.
      - name: Tag is annotated and signed by a verified key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          object_type="$(git cat-file -t "${GITHUB_REF_NAME}")"

          if [ "${object_type}" != 'tag' ]; then
            echo "::error::${GITHUB_REF_NAME} is a lightweight tag; release tags must be annotated and signed"
            exit 1
          fi

          tag_sha="$(git rev-parse "${GITHUB_REF_NAME}")"
          verified="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}" --jq '.verification.verified')"
          reason="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}" --jq '.verification.reason')"

          if [ "${verified}" != 'true' ]; then
            echo "::error::tag signature is not verified (${reason})"
            exit 1
          fi

          echo "Tag signature verified (${reason})"

      - name: Tag is reachable from the default branch
        run: |
          git fetch --no-tags origin "+refs/heads/${GITHUB_BASE_REF:-main}:refs/remotes/origin/main" 2>/dev/null || \
            git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'

          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::${GITHUB_REF_NAME} does not point at a commit on main"
            exit 1
          fi

      # A tag that disagrees with the manifests would publish versions nobody can correlate across
      # the three ecosystems, which defeats the shared version line.
      - name: Manifests agree with the tag
        run: |
          version='${{ steps.version.outputs.version }}'
          status=0

          npm_version="$(python3 -c "import json;print(json.load(open('js/package.json'))['version'])")"
          py_version="$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)"
          init_version="$(grep -m1 '^__version__' src/matchory_coding_style/__init__.py | cut -d'"' -f2)"

          for pair in "js/package.json:${npm_version}" "pyproject.toml:${py_version}" "__init__.py:${init_version}"; do
            if [ "${pair##*:}" != "${version}" ]; then
              echo "::error::${pair%%:*} declares ${pair##*:}, tag says ${version}"
              status=1
            fi
          done

          exit "${status}"

      - name: The changelog mentions this version
        run: |
          if ! grep -qF "[${{ steps.version.outputs.version }}]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no entry for ${{ steps.version.outputs.version }}"
            exit 1
          fi

      # Publishing a commit whose CI never passed is how a broken or malicious change reaches a
      # registry unnoticed.
      - name: CI succeeded for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&status=completed" \
            --jq '[.workflow_runs[] | select(.name == "CI")] | first | .conclusion // "missing"')"

          if [ "${conclusion}" != 'success' ]; then
            echo "::error::CI for ${GITHUB_SHA} is '${conclusion}', expected success"
            exit 1
          fi

  build-npm:
    name: Build the npm tarball
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      # --ignore-scripts stops any dependency's lifecycle hook from executing on the machine that
      # builds a published artefact. Nothing in this package's dev tree needs one.
      - name: Install dependencies
        working-directory: js
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Committed artefacts are current
        working-directory: js
        run: node scripts/generate.mjs --check

      - name: Pack
        id: pack
        working-directory: js
        run: |
          tarball="$(npm pack --silent)"
          echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"
          sha256sum "${tarball}" | tee "${tarball}.sha256"

      - name: Attest provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: js/${{ steps.pack.outputs.tarball }}

      - name: Upload
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: npm-tarball
          path: |
            js/${{ steps.pack.outputs.tarball }}
            js/${{ steps.pack.outputs.tarball }}.sha256
          if-no-files-found: error
          retention-days: 7

  build-python:
    name: Build the Python distributions
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Build sdist and wheel
        run: |
          uv build --out-dir dist
          ls -l dist
          sha256sum dist/* | tee dist/SHA256SUMS

      # The wheel and the sdist must contain the same presets that ship in the other two packages.
      - name: The built wheel carries the presets
        run: |
          python3 - <<'PY'
          import pathlib, zipfile, sys

          wheels = list(pathlib.Path('dist').glob('*.whl'))
          assert len(wheels) == 1, wheels
          names = set(zipfile.ZipFile(wheels[0]).namelist())

          required = {
              'matchory_coding_style/ruff/base.toml',
              'matchory_coding_style/ruff/strict.toml',
              'matchory_coding_style/data/editorconfig',
              'matchory_coding_style/cli.py',
          }
          missing = sorted(required - names)

          if missing:
              print(f'::error::wheel is missing: {", ".join(missing)}')
              sys.exit(1)

          print('wheel carries every preset')
          PY

      # Install the artefact that is about to be published and drive it, rather than trusting that
      # source-tree tests imply a working wheel. Packaging mistakes only show up here.
      - name: The built wheel works when installed
        run: |
          probe="$(mktemp -d)"
          wheel="$(echo dist/*.whl)"

          uvx --from "./${wheel}" matchory-coding-style sync --preset strict --project-root "${probe}"

          printf '[project]\nname = "probe"\nversion = "0.1.0"\n\n[tool.ruff]\nextend = ".matchory/ruff.toml"\n' \
            > "${probe}/pyproject.toml"

          cd "${probe}"
          uvx --from "${GITHUB_WORKSPACE}/${wheel}" matchory-coding-style verify --strict

      - name: Attest provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: 'dist/*.whl, dist/*.tar.gz'

      - name: Upload
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: python-dists
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish-npm:
    name: Publish to npmjs
    needs: [verify, build-npm]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      # id-token is what makes trusted publishing and provenance work. contents stays read; this job
      # writes nothing to the repository.
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # npm's documented workflow uses setup-node's `registry-url`. It is omitted here because the
      # publish command pins `--registry` explicitly, which is strictly stronger: it cannot be
      # overridden by an ambient .npmrc, whereas `publishConfig.registry` and setup-node's config can
      # both lose to an `@scope:registry` entry.
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Pin npm
        run: npm install -g "npm@${NPM_VERSION}"

      - name: Download the attested tarball
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: npm-tarball
          path: dist

      - name: Checksum matches what was attested
        run: |
          cd dist
          sha256sum --check ./*.sha256

      # npm will not let a trusted publisher be attached to a package that does not exist yet, so the
      # very first publish has to authenticate with a token. That path is deliberately single-use:
      # once the package exists, a token becomes a hard failure rather than a quiet fallback, which is
      # what stops the bootstrap credential from silently becoming permanent.
      #
      # Provenance is unaffected either way. `--provenance` is generated from this job's OIDC identity
      # token via Sigstore and is independent of how npm authenticates, so v0.1.0 is fully attested
      # even though it predates trusted publishing.
      - name: Decide the authentication path
        id: auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if npm view @matchory/coding-style version --registry https://registry.npmjs.org > /dev/null 2>&1; then
            exists=true
          else
            exists=false
          fi

          if [ -n "${NPM_TOKEN}" ] && [ "${exists}" = 'true' ]; then
            echo "::error::@matchory/coding-style already exists on npmjs, so trusted publishing can be configured. Delete the NPM_TOKEN secret from the 'release' environment and revoke the token; this workflow will then authenticate via OIDC."
            exit 1
          fi

          if [ -n "${NPM_TOKEN}" ]; then
            echo 'method=token' >> "$GITHUB_OUTPUT"
            echo "::warning::Bootstrapping the first publish with a token because the package does not exist yet. Immediately afterwards: configure the trusted publisher on npmjs, set publishing access to 'Require trusted publishing', then delete the NPM_TOKEN secret and revoke the token. The next release will fail until you do."
          elif [ "${exists}" = 'false' ]; then
            echo "::error::@matchory/coding-style does not exist on npmjs and no NPM_TOKEN is set. npm cannot attach a trusted publisher to a non-existent package, so the first publish needs a short-lived granular token in the 'release' environment. See SECURITY.md."
            exit 1
          else
            echo 'method=oidc' >> "$GITHUB_OUTPUT"
            echo 'Publishing via OIDC trusted publishing'
          fi

      # `publishConfig.registry` in package.json does NOT win over an `@scope:registry` entry in an
      # .npmrc, and npm's provenance code does not validate which registry it is publishing to. So a
      # stray scope mapping — a developer's ~/.npmrc, a repository .npmrc added later, setup-node's
      # registry wiring — could redirect a provenance-signed release to another registry entirely.
      # Pinning --registry on the command line removes that vector, and this asserts it took effect.
      - name: The resolved publish registry is npmjs
        run: |
          resolved="$(npm config get @matchory:registry)"

          if [ "${resolved}" != 'undefined' ] && [ "${resolved#https://registry.npmjs.org}" = "${resolved}" ]; then
            echo "::warning::@matchory:registry resolves to ${resolved}; --registry overrides it for this publish"
          fi

      - name: Publish
        env:
          # Empty on every release after the first, in which case npm authenticates via OIDC.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ '${{ steps.auth.outputs.method }}' = 'token' ]; then
            npm config set '//registry.npmjs.org/:_authToken' "${NPM_TOKEN}"
          fi

          npm publish ./dist/*.tgz \
            --registry https://registry.npmjs.org \
            --provenance \
            --access public \
            --tag '${{ needs.verify.outputs.dist_tag }}'

          # Leave nothing behind on the runner even though it is ephemeral.
          npm config delete '//registry.npmjs.org/:_authToken' || true

  publish-pypi:
    name: Publish to PyPI
    needs: [verify, build-python]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the attested distributions
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: python-dists
          path: dist

      - name: Checksum matches what was attested
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          rm SHA256SUMS

      # No password or token: trusted publishing via OIDC. `attestations: true` makes the action
      # generate and upload PEP 740 digital attestations alongside the distributions.
      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          attestations: true
          print-hash: true

  github-release:
    name: Publish the GitHub release
    needs: [verify, publish-npm, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Download artefacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          path: artefacts
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          {
            printf 'Published from a signed tag with build provenance.\n\n'
            printf '| Package | Registry |\n|---|---|\n'
            printf '| `matchory/coding-style` | [Packagist](https://packagist.org/packages/matchory/coding-style) |\n'
            printf '| `@matchory/coding-style` | [npm](https://www.npmjs.com/package/@matchory/coding-style/v/%s) |\n' "${VERSION}"
            printf '| `matchory-coding-style` | [PyPI](https://pypi.org/project/matchory-coding-style/%s/) |\n\n' "${VERSION}"
            printf 'Verify the artefacts:\n\n```bash\ngh attestation verify <file> --repo %s\n```\n\n' "${GITHUB_REPOSITORY}"
            printf -- '---\n\n'
            sed -n "/^## \[${VERSION}\]/,/^## \[/p" CHANGELOG.md | sed '$d'
          } > notes.md

          prerelease_flag=''
          if [ '${{ needs.verify.outputs.prerelease }}' = 'true' ]; then
            prerelease_flag='--prerelease'
          fi

          # shellcheck disable=SC2086
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            --verify-tag \
            ${prerelease_flag} \
            artefacts/*
