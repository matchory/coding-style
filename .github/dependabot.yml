# Follows the matchory supply chain baseline:
# https://github.com/matchory/.github/blob/main/supply-chain/STANDARD.md
#
#   - cooldown: a release must be 3 days old before Dependabot proposes it
#     (does not delay security updates)
#   - minor + patch updates arrive as ONE grouped PR per ecosystem
#   - major updates are never grouped: one PR per dependency, reviewed on its own
#   - security updates get their own group per ecosystem
#
# Layout note: this repository publishes three packages, and each ecosystem's manifest sits where its
# packaging rules force it. composer.json and pyproject.toml are at the root; the npm package is in
# `js/`. See the README.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    cooldown:
      default-days: 3
      semver-major-days: 3
      semver-minor-days: 3
      semver-patch-days: 3
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]
    labels: [dependencies, github-actions]

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    cooldown:
      default-days: 3
      semver-major-days: 3
      semver-minor-days: 3
      semver-patch-days: 3
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]
    versioning-strategy: increase-if-necessary
    labels: [dependencies, php]
    allow:
      - {dependency-type: all}

  - package-ecosystem: npm
    directory: /js
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    cooldown:
      default-days: 3
      semver-major-days: 3
      semver-minor-days: 3
      semver-patch-days: 3
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]
    versioning-strategy: increase-if-necessary
    labels: [dependencies, javascript]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    cooldown:
      default-days: 3
      semver-major-days: 3
      semver-minor-days: 3
      semver-patch-days: 3
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]
    labels: [dependencies, python]
